<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Data Analyst | محلل البيانات الصوتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--paper:#EFF2F1;--panel:#fff;--ink:#16212B;--muted:#5B6773;--line:#D3DAD9;--accent:#0B7A75;--accent-ink:#fff;--rec:#C8372D;--code:#E6ECEB;--warn:#8A5A00}
@media (prefers-color-scheme:dark){:root{--paper:#12191D;--panel:#1B252B;--ink:#E7EEEE;--muted:#9AA8AD;--line:#2F3D44;--accent:#3FB8B0;--accent-ink:#06201F;--rec:#F0685D;--code:#10171A;--warn:#E3B04B}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
header{padding:20px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0;font-weight:600}
header span{color:var(--muted)}
main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:24px;padding:24px clamp(16px,4vw,40px);max-width:1280px;margin:auto}
@media (max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{font-size:1rem;margin:0 0 12px;font-weight:600}
label.drop{display:block;border:1.5px dashed var(--line);border-radius:8px;padding:18px;text-align:center;cursor:pointer;color:var(--muted)}
label.drop:hover,label.drop:focus-within{border-color:var(--accent);color:var(--ink)}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.tbl{margin-top:14px;font-size:.9rem}
.tbl b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chips span{background:var(--code);border-radius:5px;padding:1px 8px;font-size:.82rem}
.mic-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;flex:none}
#mic svg{width:34px;height:34px}
#mic.rec{background:var(--rec);animation:pulse 1.2s ease-in-out infinite}
#mic:disabled{opacity:.45;cursor:not-allowed}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--rec) 22%,transparent)}}
@media (prefers-reduced-motion:reduce){#mic.rec{animation:none}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{color:var(--muted)}
.opts{display:flex;gap:12px;align-items:center;margin-top:6px;flex-wrap:wrap}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
#out{margin-top:20px;display:grid;gap:16px}
.card h3{font-size:.9rem;margin:0 0 4px;color:var(--muted);font-weight:500}
.card p,.card pre{margin:0}
pre{background:var(--code);padding:12px;border-radius:6px;overflow-x:auto;direction:ltr;text-align:left;font:.88rem/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.scroll{overflow:auto;max-height:380px;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{position:sticky;top:0;background:var(--code)}
.err{color:var(--rec)}
.note{color:var(--warn);font-size:.9rem}
</style>
</head>
<body>
<header><h1>Voice Data Analyst</h1><span>اسأل بياناتك بصوتك — Ask your data out loud</span></header>
<main>
  <section aria-labelledby="h-data">
    <h2 id="h-data">Dataset | البيانات</h2>
    <label class="drop"><input type="file" id="file" accept=".csv,.tsv,.xlsx,.xls,.json"><span id="drop-text">Choose a CSV, Excel or JSON file<br>اختر ملف بيانات</span></label>
    <div id="schema" class="tbl" aria-live="polite"></div>
  </section>
  <section aria-labelledby="h-ask">
    <h2 id="h-ask">Ask | اسأل</h2>
    <div class="mic-row">
      <button id="mic" disabled aria-label="Start or stop recording" title="Upload a dataset first">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
      </button>
      <div>
        <div class="status" id="status" role="status">Upload a dataset to start.</div>
        <div class="opts">
          <label>Speech language <select id="lang"><option value="">Auto</option><option value="ar">العربية</option><option value="en">English</option></select></label>
        </div>
      </div>
    </div>
    <div id="out" aria-live="polite"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let datasetId = null, recorder = null, chunks = [], busy = false;

async function api(url, opts) {
  const r = await fetch(url, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || ("Request failed (" + r.status + ")"));
  return body;
}
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k));
  return n;
};
const setStatus = (t, cls = "") => { $("status").textContent = t; $("status").className = "status " + cls; };
const setReady = on => { $("mic").disabled = !on; $("mic").title = on ? "" : "Upload a dataset first"; };

$("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  setStatus("Loading dataset…"); setReady(false);
  try {
    const d = await api("/api/datasets", { method: "POST", body: fd });
    datasetId = d.dataset_id;
    $("drop-text").textContent = d.filename;
    const box = $("schema"); box.replaceChildren();
    d.tables.forEach(t => {
      box.append(el("b", { textContent: t.name + " (" + t.row_count + ")", dir: "auto" }));
      const chips = el("div", { className: "chips" });
      t.columns.forEach(c => chips.append(el("span", { textContent: c.name, dir: "auto", title: c.type })));
      box.append(chips);
    });
    setReady(true); setStatus("Ready. Press the microphone and speak.");
  } catch (err) { setStatus(err.message, "err"); }
});

function render(r) {
  const out = $("out"); out.replaceChildren();
  const card = (title, node) => out.append(el("div", { className: "card" }, el("h3", { textContent: title }), node));
  if (r.transcript) card("Heard (" + r.transcript.language + ")", el("p", { textContent: r.transcript.text, dir: "auto" }));
  if (r.sql) card("Generated SQL", el("pre", { textContent: r.sql }));
  if (r.columns && r.columns.length) {
    const t = el("table", {}, el("thead", {}, el("tr", {}, ...r.columns.map(c => el("th", { textContent: c, dir: "auto" })))),
      el("tbody", {}, ...r.rows.map(row => el("tr", {}, ...row.map(v => el("td", { textContent: v === null ? "—" : v, dir: "auto" }))))));
    card(r.row_count + " row(s)" + (r.truncated ? " (truncated)" : ""), el("div", { className: "scroll" }, t));
  }
}

async function ask(call) {
  if (busy) return; busy = true; setReady(false);
  try { const r = await call(); render(r); setStatus("Done."); }
  catch (err) { $("out").replaceChildren(el("p", { className: "err", textContent: err.message })); setStatus("Something went wrong.", "err"); }
  busy = false; setReady(true);
}

$("mic").addEventListener("click", async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream); chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      $("mic").classList.remove("rec");
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      const ext = blob.type.includes("mp4") ? "m4a" : blob.type.includes("ogg") ? "ogg" : "webm";
      const fd = new FormData();
      fd.append("dataset_id", datasetId); fd.append("audio", blob, "question." + ext);
      fd.append("language", $("lang").value);
      setStatus("Transcribing and analyzing…");
      ask(() => api("/api/analyze", { method: "POST", body: fd }));
    };
    recorder.start(); $("mic").classList.add("rec"); setStatus("Listening… press again to stop.");
  } catch (err) { setStatus("Microphone unavailable: " + err.message, "err"); }
});
</script>
</body>
</html>
